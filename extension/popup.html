<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        margin: 0;
        padding: 12px;
        width: 340px;
      }
      .title {
        font-weight: 600;
        margin-bottom: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .url {
        color: #666;
        font-size: 11px;
        margin-bottom: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      label {
        display: block;
        font-size: 11px;
        color: #444;
        margin-bottom: 4px;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 90px;
        resize: vertical;
        font: inherit;
        padding: 6px;
      }
      .status {
        font-size: 11px;
        min-height: 14px;
        margin-top: 6px;
        color: #666;
      }
      .status.error { color: #c62828; }
      .status.ok { color: #2e7d32; }
      .buttons {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 8px;
      }
      button {
        font: inherit;
        padding: 4px 12px;
        cursor: pointer;
      }
      button.primary { font-weight: 600; }
      button[disabled] { cursor: default; opacity: 0.6; }
    </style>
  </head>
  <body>
    <div class="title" id="title">Loading…</div>
    <div class="url" id="url"></div>
    <label for="comment">Comment (optional)</label>
    <textarea id="comment" autofocus></textarea>
    <div class="status" id="status"></div>
    <div class="buttons">
      <button id="cancel">Cancel</button>
      <button id="save" class="primary">Save</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
