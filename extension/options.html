<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Web Ingest options</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        padding: 20px;
        max-width: 480px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 16px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .hint {
        color: #666;
        font-size: 12px;
        margin-top: 6px;
        margin-left: 24px;
      }
      .saved {
        color: #2e7d32;
        font-size: 12px;
        margin-top: 12px;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Web Ingest</h1>
    <label>
      <input type="checkbox" id="askForComment" />
      Ask for a comment when clipping
    </label>
    <div class="hint">
      When enabled, clicking the toolbar icon opens a small popup with a
      comment field. The comment is stored alongside the page in the YAML
      frontmatter.
    </div>
    <div class="saved" id="saved"></div>
    <script src="options.js"></script>
  </body>
</html>
